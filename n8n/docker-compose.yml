# Self-hosted n8n for LendLoop.
#
#   cp .env.example .env                                   # then fill in the secrets
#   openssl rand -hex 32 > secrets/n8n_encryption_key
#   docker compose up -d
#
# On first start `n8n-import` imports and publishes the workflows in ./workflows,
# then n8n starts. Open http://localhost:5678 and create the owner account.
#
# Exposure: n8n (editor + API) listens on 127.0.0.1:5678 only. `webhook-gateway`
# on 127.0.0.1:8080 forwards *only* POST /webhook/lendloop-loan-events. If Convex
# must reach n8n from the internet, expose the gateway, never port 5678.

x-n8n-env: &n8n-env
  # --- secrets (never committed) ------------------------------------------
  # The credential-encryption key is read from a Docker secret file, so it is not
  # an environment variable and Code nodes cannot read it through $env.
  N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
  # The two HMAC secrets are the only secrets in the environment: Code nodes need
  # them to sign and verify. Anyone who can edit workflows can read them, so keep
  # workflow-edit rights to the owner account.
  LENDLOOP_TO_N8N_SECRET: ${LENDLOOP_TO_N8N_SECRET:?set LENDLOOP_TO_N8N_SECRET in n8n/.env}
  N8N_TO_LENDLOOP_SECRET: ${N8N_TO_LENDLOOP_SECRET:?set N8N_TO_LENDLOOP_SECRET in n8n/.env}
  # --- integration config ---------------------------------------------------
  # Convex HTTP actions URL (*.convex.site, or http://host.docker.internal:3211 for a local backend)
  CONVEX_SITE_URL: ${CONVEX_SITE_URL:?set CONVEX_SITE_URL in n8n/.env}
  SIMULATE_NOTIFY_FAILURE: ${SIMULATE_NOTIFY_FAILURE:-false}
  # --- n8n runtime ----------------------------------------------------------
  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
  TZ: ${GENERIC_TIMEZONE:-UTC}
  WEBHOOK_URL: ${N8N_PUBLIC_URL:-http://localhost:5678/}
  # Code nodes read the two signing secrets via $env and use node:crypto for HMAC.
  N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
  NODE_FUNCTION_ALLOW_BUILTIN: crypto
  N8N_RUNNERS_ENABLED: "true"
  N8N_DIAGNOSTICS_ENABLED: "false"
  N8N_PERSONALIZATION_ENABLED: "false"
  # Don't keep execution data (which contains recipient addresses) forever.
  EXECUTIONS_DATA_PRUNE: "true"
  EXECUTIONS_DATA_MAX_AGE: "168" # hours

services:
  n8n-import:
    image: docker.n8n.io/n8nio/n8n:2.47.5
    environment: *n8n-env
    secrets: [n8n_encryption_key]
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    entrypoint: ["/bin/sh", "-c"]
    # Import + publish once. Later `up`s leave workflows edited in the UI alone;
    # delete the volume (docker compose down -v) to start fresh.
    command:
      - |
        set -e
        MARKER=/home/node/.n8n/.lendloop-workflows-imported
        if [ -f "$$MARKER" ]; then echo "LendLoop workflows already imported"; exit 0; fi
        n8n import:workflow --separate --input=/workflows
        for id in lendloopErrors01 lendloopNotify01 lendloopRemind01; do n8n publish:workflow --id=$$id; done
        touch "$$MARKER"
    restart: "no"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.47.5
    depends_on:
      n8n-import:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5678:5678"
    environment: *n8n-env
    secrets: [n8n_encryption_key]
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  webhook-gateway:
    image: caddy:2.11.9
    depends_on: [n8n]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    restart: unless-stopped

secrets:
  n8n_encryption_key:
    file: ./secrets/n8n_encryption_key

volumes:
  n8n_data:
